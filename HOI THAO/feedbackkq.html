<body>

<h2>Đóng góp ý kiến cho HOI THAO</h2>

<form action="feedback.html">
    <p>1. Thông tin về người góp ý</p>
    Họ và tên:
    <input type="text" name="txtTen"><br><br>
    Địa chỉ email:
    <input type="email" name="txtEmail"><br><br>
    <input type="password" name="txtPassword"><br><br>
    <p>2. Đóng góp ý kiến</p>
    Ý kiến đóng góp:<br>
    <textarea name="txtComment" rows="6" cols="40"></textarea>
<p>Thể loại cần bổ sung thêm sách:</p>

    <input type="checkbox" name="Bong Da"> bong da<br>
    <input type="checkbox" name="Bong Chuyen"> bong chuyen<br>
    <input type="checkbox" name="Bong Ro"> bong ro<br>
   

    <input type="submit" value="Góp ý">
    <action="feedback.html> </action>

</form>
</body>
</html>
